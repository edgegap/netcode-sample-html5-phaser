# Tests the game server, then builds its image and pushes it to the Edgegap Container Registry on
# every push to main that touches the server. The tag is the UTC time (YYYYMMDD-HHMM), also used as
# the Edgegap app version name. Point the app version at the new tag to ship it.
#
# Repository settings (pushing is skipped until they exist, so forks only run the test):
#   secrets   EDGEGAP_REGISTRY_USERNAME, EDGEGAP_REGISTRY_TOKEN  (Edgegap dashboard > Container Registry)
#   variables EDGEGAP_REGISTRY_PROJECT                           (the <project> in registry.edgegap.com/<project>/...)
name: Server image

on:
  push:
    branches: [main]
    paths: [server/**, tools/**, package.json, package-lock.json, Dockerfile, .github/workflows/server-image.yml]
  pull_request:
    paths: [server/**, tools/**, package.json, package-lock.json, Dockerfile]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: splat-arena

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local match test (two headless players and bots, no Edgegap)
        run: npm test

      - name: Image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Build only (no registry configured, or a pull request)
        if: github.event_name == 'pull_request' || vars.EDGEGAP_REGISTRY_PROJECT == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      - if: github.event_name != 'pull_request' && vars.EDGEGAP_REGISTRY_PROJECT != ''
        uses: docker/login-action@v3
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
      - if: github.event_name != 'pull_request' && vars.EDGEGAP_REGISTRY_PROJECT != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A plain image manifest: with the default attestations Edgegap failed to pull the image.
          provenance: false
          sbom: false
          tags: registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - if: github.event_name != 'pull_request' && vars.EDGEGAP_REGISTRY_PROJECT != ''
        run: echo "Pushed registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
